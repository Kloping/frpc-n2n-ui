name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0），留空则沿用 tauri.conf.json'
        required: false
        default: ''
      release_tag:
        description: '发布到 Release 的 tag（如 v0.1.0），留空则只构建产物、不发布'
        required: false
        default: ''

# 同一分支/tag 只保留最新一次构建，避免并发抢占缓存
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 与 src-tauri/binaries/ 中内置版本保持一致，升级时同步 README
  FRP_VERSION: '0.71.1'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # tag 触发时取 tag 名，手动触发时取输入值；为空表示不发布 Release
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: windows-x64-release

      # src-tauri/binaries/ 被 .gitignore 排除，CI 必须自行补齐，否则 externalBin 打包失败
      - name: Fetch frpc binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:FRP_VERSION
          $url = "https://github.com/fatedier/frp/releases/download/v$ver/frp_${ver}_windows_amd64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile frp.zip -UseBasicParsing
          Expand-Archive -Path frp.zip -DestinationPath frp-tmp -Force

          $frpc = Get-ChildItem -Path frp-tmp -Recurse -Filter frpc.exe | Select-Object -First 1
          if (-not $frpc) { throw 'frpc.exe not found in frp archive' }

          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $frpc.FullName src-tauri/binaries/frpc-x86_64-pc-windows-msvc.exe -Force
          Remove-Item frp.zip, frp-tmp -Recurse -Force

          $target = 'src-tauri/binaries/frpc-x86_64-pc-windows-msvc.exe'
          $size = [math]::Round((Get-Item $target).Length / 1MB, 2)
          if ($size -lt 1) { throw "frpc.exe looks invalid ($size MB)" }
          Write-Host "frpc v$ver ready (${size} MB)"

      # tag 与配置文件版本对齐，保证产物文件名与 Release 一致
      - name: Sync version with tag
        if: env.APP_VERSION != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = ($env:APP_VERSION -replace '^v', '').Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "Invalid version: $v" }

          $utf8 = New-Object System.Text.UTF8Encoding($false)

          # 只替换第一处，避免误改其他同名字段
          $confPath = Join-Path $PWD 'src-tauri/tauri.conf.json'
          $conf = Get-Content $confPath -Raw -Encoding utf8
          $confRe = [regex]'"version"\s*:\s*"[^"]*"'
          $conf = $confRe.Replace($conf, '"version": "' + $v + '"', 1)
          [System.IO.File]::WriteAllText($confPath, $conf, $utf8)

          $cargoPath = Join-Path $PWD 'src-tauri/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw -Encoding utf8
          $cargoRe = [regex]'(?m)^version = "[^"]*"'
          $cargo = $cargoRe.Replace($cargo, 'version = "' + $v + '"', 1)
          [System.IO.File]::WriteAllText($cargoPath, $cargo, $utf8)

          Write-Host "Version synced to $v"

      - name: Install npm dependencies
        run: npm ci

      # --bundles nsis 覆盖配置里的 targets: all，只产出 .exe 安装包
      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'frpc-n2n ${{ env.RELEASE_TAG }}'
          releaseBody: |
            Windows x64 构建产物：

            - `*-setup.exe` — NSIS 安装包，按当前用户安装，无需管理员权限
            - `*-portable.exe` — 免安装单文件版

            内置 frpc v${{ env.FRP_VERSION }}，系统需具备 WebView2 运行时（Win10 1803+ 通常自带）。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null

          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer not found under bundle/nsis' }
          Copy-Item $setup.FullName "dist-artifacts/frpc-n2n_${v}_x64-setup.exe"

          $portable = 'src-tauri/target/release/frpc-n2n.exe'
          if (Test-Path $portable) {
            Copy-Item $portable "dist-artifacts/frpc-n2n_${v}_x64-portable.exe"
          } else {
            Write-Warning 'portable exe not found, skipped'
          }

          Get-ChildItem dist-artifacts | Format-Table Name, Length -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frpc-n2n-windows-x64
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

      # tauri-action 只会把 bundle 产物挂到 Release，便携版单独补传
      - name: Attach portable exe to release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Get-ChildItem dist-artifacts/*portable.exe -ErrorAction SilentlyContinue
          if ($p) {
            gh release upload $env:RELEASE_TAG $p.FullName --clobber
            Write-Host "Uploaded $($p.Name)"
          } else {
            Write-Host 'No portable exe to upload'
          }
