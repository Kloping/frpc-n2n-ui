[package]
name = "frpc-n2n"
version = "0.1.0"
description = "frpc 内网穿透桌面管理器"
authors = ["github@kloping"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "frpc_n2n_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
